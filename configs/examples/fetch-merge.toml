# PubTator3 supplies all annotation text. Entrez and Europe PMC contribute the
# selected metadata fields below and cannot fill or replace title, abstract, or full text.
# PMIDs that PubTator3 does not return with usable text are skipped and reported.

[input]
mode = "pmid_file"
pmid_file = "data/inputs/example_pmids.txt"
source = ["pubtator3", "entrez"]

[input.fields_per_source]
entrez = ["mesh_terms", "authors", "journal", "year"]
europe_pmc = ["citation_count", "is_open_access", "license"]

[enrichment]
sources = []

[annotators]
enabled = []

[output]
path = "outputs/examples/fetch-merge.json"
