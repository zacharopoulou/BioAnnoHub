name: Publish

# Pushes the slim image for a release tag (vX.Y.Z). The full image does not fit on
# a GitHub runner; publish it with tools/publish_full.sh.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  slim:
    name: Build and publish the slim image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check the tag matches the project version
        id: release
        run: echo "version=$(python3 tools/validate_release_version.py "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3.11.1

      - name: Build the slim image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          cache-from: type=gha
          load: true
          tags: biogemt/bioannohub:${{ steps.release.outputs.version }}

      - name: Run the tests
        run: docker run --rm --entrypoint python -w /repository biogemt/bioannohub:${{ steps.release.outputs.version }} -m pytest -m 'not integration'

      - uses: docker/login-action@v3.4.0
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Push the slim image
        run: docker push biogemt/bioannohub:${{ steps.release.outputs.version }}
